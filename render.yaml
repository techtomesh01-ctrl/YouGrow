services:
  - type: web
    name: yougrow-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yougrow-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false

databases:
  - name: yougrow-db
    plan: free
    databaseName: yougrow
    user: yougrow_user
