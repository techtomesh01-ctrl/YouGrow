{% extends "base.html" %}{% block title %}Join YouGrow{% endblock %}{% block body %}<div style="max-width:570px;margin:20px auto"><section class="panel" style="padding:clamp(26px,6vw,48px);background:radial-gradient(ellipse at 100% 0%,#f3263f1c,transparent 46%),linear-gradient(145deg,#19191f,#111114)"><div class="tag">YOUR NEXT CHAPTER STARTS HERE</div><h1 style="font-size:clamp(2.2rem,6vw,3.3rem);line-height:1.05;letter-spacing:-.06em;margin:12px 0">Make room to <span style="color:var(--red2)">grow.</span></h1><p class="muted">अपना free account बनाएँ और YouGrow creator community से जुड़ें।</p><form method="post" style="margin-top:28px"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><label for="display_name">Display name / आपका नाम</label><input class="field" id="display_name" name="display_name" maxlength="80" autocomplete="name" placeholder="How should we call you?" required><label for="email">Email address</label><input class="field" id="email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password (at least 10 characters)</label><input class="field" id="password" type="password" name="password" minlength="10" autocomplete="new-password" placeholder="Create a strong password" required><button style="width:100%;margin-top:5px">Create my free account ↗</button></form><p class="muted" style="text-align:center;margin:24px 0 0">Already a member? <a href="/login">Log in</a></p></section></div>{% endblock %}
