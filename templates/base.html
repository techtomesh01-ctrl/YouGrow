<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>{% block title %}YouGrow{% endblock %}</title>
{% if adsense_ready %}<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ adsense_client_id|urlencode }}" crossorigin="anonymous"></script>{% endif %}
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b2e;--panel2:#18233a;--line:#293653;--lime:#c7f36b;--violet:#9c8cff;--muted:#a8b4ce;--text:#f6f8ff;--shadow:0 22px 70px #03061166}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#283d6755,transparent 38%),radial-gradient(ellipse at 88% 8%,#6a4dd522,transparent 30%),var(--bg);color:var(--text);font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--lime);text-decoration:none}a:hover{color:#e2ffad}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:15px max(20px,calc((100% - 1160px)/2));gap:18px;flex-wrap:wrap;background:#0b1020dc;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}nav{display:flex;align-items:center;gap:clamp(10px,2vw,24px);flex-wrap:wrap}nav>a{color:#dce3f5;font-size:.93rem;font-weight:600}nav>a:hover{color:var(--lime)}.brand{display:flex;align-items:center;gap:10px;color:white!important;font-weight:950;font-size:1.38rem;letter-spacing:-.055em}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--lime),#86d8a5);color:#111827;font-size:1.15rem;box-shadow:0 5px 25px #c7f36b22}.brand span{color:var(--lime)}main{width:min(1160px,100%);margin:0 auto;padding:38px 22px 80px}.hero,.panel,.channel{position:relative;overflow:hidden;background:linear-gradient(145deg,#18233aee,#11192aee);border:1px solid #ffffff13;border-radius:24px;padding:clamp(22px,4vw,42px);margin:14px 0;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:-100px;top:-145px;width:300px;height:300px;border-radius:50%;border:1px solid #c7f36b18;box-shadow:0 0 0 32px #c7f36b08,0 0 0 64px #c7f36b05;pointer-events:none}.hero h1{max-width:800px;font-size:clamp(2.6rem,7vw,5.3rem);letter-spacing:-.065em;line-height:.99;margin:16px 0 20px}.hero p{max-width:680px;font-size:1.07rem}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr));gap:18px}.channel{padding:25px;min-height:245px;transition:transform .22s,border-color .22s,background .22s}.channel:hover{transform:translateY(-4px);border-color:#c7f36b55;background:linear-gradient(145deg,#1d2b43,#121b2c)}.channel h3{font-size:1.35rem;line-height:1.2;letter-spacing:-.025em;margin:12px 0}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:12px 18px;background:var(--lime);color:#101827;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;transition:transform .18s,filter .18s;box-shadow:0 7px 25px #c7f36b16}.btn:hover,button:hover{color:#101827;filter:brightness(1.06);transform:translateY(-1px)}.btn.secondary,button.secondary{background:#222e48;color:#f4f6ff;border-color:#ffffff12;box-shadow:none}.field{display:block;width:100%;padding:14px 15px;margin:7px 0 18px;border:1px solid #33415f;border-radius:12px;background:#0b1222;color:white;font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}.field:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c7f36b1c}label{display:block;color:#dbe3f7;font-size:.93rem;font-weight:650}.flash{padding:14px 17px;background:#2b263e;border:1px solid #7567b555;border-radius:14px;margin:10px 0 18px}.tag{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;font-weight:850;color:var(--lime)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}form.inline{display:inline}small{color:var(--muted)}h2{letter-spacing:-.035em;font-size:clamp(1.5rem,3vw,2rem)}h3{letter-spacing:-.02em}hr{border:0;border-top:1px solid var(--line)}.empty-state{padding:32px;text-align:center;border:1px dashed #46516a;border-radius:18px;color:var(--muted)}footer{border-top:1px solid #ffffff12;padding:28px 20px;text-align:center;color:var(--muted);font-size:.9rem}@media(max-width:560px){header{padding:13px 16px}main{padding:24px 14px 55px}nav{gap:12px}nav>a{font-size:.85rem}.hero{padding:25px 21px;border-radius:20px}.hero h1{font-size:clamp(2.5rem,13vw,4rem)}.panel,.channel{border-radius:18px;padding:21px}}
</style></head><body><header><a class="brand" href="/" aria-label="YouGrow home"><span class="brand-mark">Y</span>You<span>Grow</span></a><nav><a href="/">Discover</a><a href="/dashboard">Dashboard</a>{% if user %}<form class="inline" method="post" action="/logout"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn secondary">Log out ↗</button></form>{% else %}<a href="/login">Log in</a><a class="btn" href="/register">Join free ↗</a>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<div class="flash">{{message}}</div>{% endfor %}{% block body %}{% endblock %}</main><footer>Made for creators. Built for genuine discovery. <span style="color:var(--lime)">●</span> YouGrow</footer></body></html>
