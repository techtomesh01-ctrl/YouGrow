<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090c"><title>{% block title %}YouGrow{% endblock %}</title>
{% if adsense_ready %}<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ adsense_client_id|urlencode }}" crossorigin="anonymous"></script>{% endif %}
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#181818;--panel2:#222222;--line:#303030;--red:#ff0033;--red2:#ff0033;--muted:#aaaaaa;--text:#f1f1f1;--shadow:0 24px 80px #000b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:#ff7180;text-decoration:none}a:hover{color:#ff9aa4}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px max(20px,calc((100% - 1160px)/2));gap:18px;flex-wrap:wrap;background:#0f0f0ff2;backdrop-filter:blur(20px);border-bottom:1px solid #303030}nav{display:flex;align-items:center;gap:clamp(10px,2vw,24px);flex-wrap:wrap}nav>a{color:#e5e3e9;font-size:.93rem;font-weight:650}nav>a:hover{color:var(--red2)}.brand{display:flex;align-items:center;gap:10px;color:white!important;font-weight:950;font-size:1.4rem;letter-spacing:-.06em}.brand-mark{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:#ff0033;color:white;box-shadow:0 6px 28px #f3263f40}.brand-mark svg{width:100%;height:100%;display:block}.nav-icon{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#ffffff0c;border:1px solid #ffffff18;color:#f7f5f7!important;transition:background .18s,border-color .18s,transform .18s}.nav-icon:hover{background:#f3263f22;border-color:#f3263f88;transform:translateY(-1px)}.nav-icon svg{width:21px;height:21px;display:block}.youtube-icon{color:#ff334b!important}.user-icon{background:linear-gradient(145deg,#24242b,#111115)}.brand span.brand-name{color:var(--red2)}main{width:min(1160px,100%);margin:0 auto;padding:38px 22px 80px}.hero,.panel,.channel{position:relative;overflow:hidden;background:linear-gradient(145deg,#201018f2,#10090df7);border:1px solid #7d263725;border-radius:24px;padding:clamp(22px,4vw,42px);margin:14px 0;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:-105px;top:-155px;width:310px;height:310px;border-radius:50%;border:1px solid #f3263f30;box-shadow:0 0 0 32px #f3263f0b,0 0 0 64px #f3263f07;pointer-events:none}.hero h1{max-width:850px;font-size:clamp(2.6rem,7vw,5.25rem);letter-spacing:-.068em;line-height:.99;margin:16px 0 20px}.hero p{max-width:700px;font-size:1.07rem}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr));gap:18px}.channel{padding:25px;min-height:245px;transition:transform .22s,border-color .22s,background .22s}.channel:hover{transform:translateY(-4px);border-color:#f3263f70;background:linear-gradient(145deg,#24161b,#141417)}.channel h3{font-size:1.35rem;line-height:1.2;letter-spacing:-.025em;margin:12px 0}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:12px 18px;background:#ff0033;color:white;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;transition:transform .18s,filter .18s;box-shadow:0 7px 28px #f3263f25}.btn:hover,button:hover{color:white;filter:brightness(1.1);transform:translateY(-1px)}.btn.secondary,button.secondary{background:#272727;color:#fff4f6;border-color:#70203666;box-shadow:none}.field{display:block;width:100%;padding:14px 15px;margin:7px 0 18px;border:1px solid #3a3943;border-radius:12px;background:#121212;color:white;font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}.field:focus{border-color:var(--red2);box-shadow:0 0 0 3px #f3263f20}label{display:block;color:#e7e4eb;font-size:.93rem;font-weight:650}.flash{padding:14px 17px;background:#272727;border:1px solid #ff0033;border-radius:14px;margin:10px 0 18px}.tag{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;font-weight:850;color:var(--red2)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}form.inline{display:inline}small{color:var(--muted)}h2{letter-spacing:-.035em;font-size:clamp(1.5rem,3vw,2rem)}h3{letter-spacing:-.02em}hr{border:0;border-top:1px solid var(--line)}summary{cursor:pointer}.empty-state{padding:32px;text-align:center;border:1px dashed #4c3036;border-radius:18px;color:var(--muted)}footer{border-top:1px solid #303030;padding:28px 20px;text-align:center;color:var(--muted);font-size:.9rem}footer .footer-dot{color:var(--red2)}@media(max-width:560px){header{padding:13px 16px}main{padding:24px 14px 55px}nav{gap:12px}nav>a{font-size:.85rem}.hero{padding:25px 21px;border-radius:20px}.hero h1{font-size:clamp(2.5rem,13vw,4rem)}.panel,.channel{border-radius:18px;padding:21px}}
/* Shared YouTube-inspired design across Home, Login, Register, Dashboard and Admin */
:root{--bg:#090909;--panel:#111111;--panel2:#171717;--line:#292929;--red:#b00020;--red2:#b00020;--muted:#a6a6a6;--text:#f1f1f1;--shadow:0 8px 28px #0008}
body{background:#090909;color:#f1f1f1}
header{background:#090909f5;border-bottom:1px solid #242424}
.brand-mark{border-radius:10px;box-shadow:none}
nav>a{color:#d5d5d5}nav>a:hover{color:#b00020}
.hero,.panel,.channel{background:#111111;border:1px solid #292929;border-radius:16px;box-shadow:none}
.hero:after{display:none}
.btn,button{background:#8f001b;border-color:#8f001b;border-radius:999px;box-shadow:none}
.btn:hover,button:hover{background:#b00020;border-color:#b00020}
.btn.secondary,button.secondary{background:#1c1c1c;border-color:#333;border-radius:999px}
.field{background:#101010;border-color:#333}
.field:focus{border-color:#8f001b;box-shadow:0 0 0 2px #8f001b33}
.tag{color:#b00020}.flash{background:#171717;border-color:#8f001b}
.channel:hover{background:#191919;border-color:#444}
footer .footer-dot{color:#8f001b}
a{color:#c35b6c}a:hover{color:#df7b89}


/* Site-wide creator arcade polish: bold, playful, accessible and responsive */
:root{--bg:#08090d;--panel:#11131a;--panel2:#191c25;--line:#292d3a;--red:#ff3155;--red2:#ff3155;--muted:#aeb4c3;--text:#f7f8fc;--shadow:0 18px 55px #0009}
body{background:radial-gradient(ellipse at 12% 0%,#35101d55,transparent 34%),radial-gradient(ellipse at 90% 18%,#122c3a40,transparent 30%),#08090d}
header{background:#08090deF;border-bottom:1px solid #ffffff12}
.brand-mark{background:linear-gradient(140deg,#ff3155,#ff7146);box-shadow:0 6px 22px #ff315533}
.brand-name{color:#ff536f!important}
nav>a:hover{color:#ff536f}
main{padding-top:30px}
.hero,.panel,.channel{background:linear-gradient(145deg,#171922,#101117);border:1px solid #ffffff16;border-radius:22px;box-shadow:0 15px 45px #0004}
.hero:after{display:block;border-color:#ff315522;box-shadow:0 0 0 30px #ff31550a,0 0 0 60px #39d9ff07}
.btn,button{background:linear-gradient(110deg,#ff3155,#ff6048);border-color:#ff5268;border-radius:12px;box-shadow:0 8px 22px #ff31551c}
.btn:hover,button:hover{filter:brightness(1.12);box-shadow:0 10px 30px #ff315533}
.btn.secondary,button.secondary{background:#1b1e28;border-color:#343847}
.field{background:#0c0e14;border-color:#343746;border-radius:13px}
.field:focus{border-color:#ff536f;box-shadow:0 0 0 3px #ff315522}
.tag{color:#ff657c}
.flash{background:#19151c;border-color:#ff536f}
.channel:hover{border-color:#ff536f80;background:linear-gradient(145deg,#20151c,#12141a)}
a{color:#ff8193}a:hover{color:#ffb0bc}
footer{border-color:#ffffff14}
@media(max-width:560px){header{gap:12px}main{padding-top:22px}.hero,.panel,.channel{border-radius:17px}}

</style></head><body><header><a class="brand" href="/" aria-label="YouGrow home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" role="img"><path d="M24 3.5 43 14.4v19.2L24 44.5 5 33.6V14.4Z" fill="currentColor" opacity=".18"/><rect x="5" y="10" width="38" height="28" rx="9" fill="#ff263f"/><path d="M21 17.5 32 24 21 30.5Z" fill="#fff"/></svg></span><span>You<span class="brand-name">Grow</span></span></a><nav><a href="/">Discover</a><a href="/dashboard">Dashboard</a>{% if user %}<a class="nav-icon youtube-icon" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="Open YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12Z"/></svg></a><a class="nav-icon user-icon" href="/dashboard" aria-label="Your account" title="Your account"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg></a><form class="inline" method="post" action="/logout"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn secondary">Log out ↗</button></form>{% else %}<a class="nav-icon youtube-icon" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="Open YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12Z"/></svg></a><a class="nav-icon user-icon" href="/login" aria-label="Log in to your account" title="Log in"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg></a><a class="btn" href="/register">Join free ↗</a>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<div class="flash">{{message}}</div>{% endfor %}{% block body %}{% endblock %}</main><footer>Made for creators. Built for genuine discovery. <span class="footer-dot">●</span> YouGrow</footer></body></html>
