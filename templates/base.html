<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090c"><title>{% block title %}YouGrow{% endblock %}</title>
{% if adsense_ready %}<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ adsense_client_id|urlencode }}" crossorigin="anonymous"></script>{% endif %}
<style>
:root{color-scheme:dark;--bg:#09090c;--panel:#141418;--panel2:#1b1b22;--line:#303038;--red:#f3263f;--red2:#ff5265;--muted:#aaaab5;--text:#faf9fb;--shadow:0 24px 80px #0009}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% -5%,#7e122522,transparent 36%),radial-gradient(ellipse at 90% 5%,#f3263f10,transparent 29%),var(--bg);color:var(--text);font:16px/1.65 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:#ff7180;text-decoration:none}a:hover{color:#ff9aa4}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px max(20px,calc((100% - 1160px)/2));gap:18px;flex-wrap:wrap;background:#09090ce8;backdrop-filter:blur(20px);border-bottom:1px solid #ffffff12}nav{display:flex;align-items:center;gap:clamp(10px,2vw,24px);flex-wrap:wrap}nav>a{color:#e5e3e9;font-size:.93rem;font-weight:650}nav>a:hover{color:var(--red2)}.brand{display:flex;align-items:center;gap:10px;color:white!important;font-weight:950;font-size:1.4rem;letter-spacing:-.06em}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#ff596c,#bd1028);color:white;font-size:1.2rem;box-shadow:0 6px 28px #f3263f40}.brand span.brand-name{color:var(--red2)}main{width:min(1160px,100%);margin:0 auto;padding:38px 22px 80px}.hero,.panel,.channel{position:relative;overflow:hidden;background:linear-gradient(145deg,#19191fef,#111114f5);border:1px solid #ffffff13;border-radius:24px;padding:clamp(22px,4vw,42px);margin:14px 0;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:-105px;top:-155px;width:310px;height:310px;border-radius:50%;border:1px solid #f3263f30;box-shadow:0 0 0 32px #f3263f0b,0 0 0 64px #f3263f07;pointer-events:none}.hero h1{max-width:850px;font-size:clamp(2.6rem,7vw,5.25rem);letter-spacing:-.068em;line-height:.99;margin:16px 0 20px}.hero p{max-width:700px;font-size:1.07rem}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr));gap:18px}.channel{padding:25px;min-height:245px;transition:transform .22s,border-color .22s,background .22s}.channel:hover{transform:translateY(-4px);border-color:#f3263f70;background:linear-gradient(145deg,#24161b,#141417)}.channel h3{font-size:1.35rem;line-height:1.2;letter-spacing:-.025em;margin:12px 0}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:12px 18px;background:linear-gradient(135deg,#ff5368,#e91e38);color:white;font:inherit;font-weight:800;text-decoration:none;cursor:pointer;transition:transform .18s,filter .18s;box-shadow:0 7px 28px #f3263f25}.btn:hover,button:hover{color:white;filter:brightness(1.1);transform:translateY(-1px)}.btn.secondary,button.secondary{background:#25252d;color:#f4f2f6;border-color:#ffffff12;box-shadow:none}.field{display:block;width:100%;padding:14px 15px;margin:7px 0 18px;border:1px solid #3a3943;border-radius:12px;background:#0d0d11;color:white;font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}.field:focus{border-color:var(--red2);box-shadow:0 0 0 3px #f3263f20}label{display:block;color:#e7e4eb;font-size:.93rem;font-weight:650}.flash{padding:14px 17px;background:#35161d;border:1px solid #8d2637;border-radius:14px;margin:10px 0 18px}.tag{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;font-weight:850;color:var(--red2)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}form.inline{display:inline}small{color:var(--muted)}h2{letter-spacing:-.035em;font-size:clamp(1.5rem,3vw,2rem)}h3{letter-spacing:-.02em}hr{border:0;border-top:1px solid var(--line)}summary{cursor:pointer}.empty-state{padding:32px;text-align:center;border:1px dashed #4c3036;border-radius:18px;color:var(--muted)}footer{border-top:1px solid #ffffff12;padding:28px 20px;text-align:center;color:var(--muted);font-size:.9rem}footer .footer-dot{color:var(--red2)}@media(max-width:560px){header{padding:13px 16px}main{padding:24px 14px 55px}nav{gap:12px}nav>a{font-size:.85rem}.hero{padding:25px 21px;border-radius:20px}.hero h1{font-size:clamp(2.5rem,13vw,4rem)}.panel,.channel{border-radius:18px;padding:21px}}
</style></head><body><header><a class="brand" href="/" aria-label="YouGrow home"><span class="brand-mark">Y</span><span>You<span class="brand-name">Grow</span></span></a><nav><a href="/">Discover</a><a href="/dashboard">Dashboard</a>{% if user %}<form class="inline" method="post" action="/logout"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn secondary">Log out ↗</button></form>{% else %}<a href="/login">Log in</a><a class="btn" href="/register">Join free ↗</a>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<div class="flash">{{message}}</div>{% endfor %}{% block body %}{% endblock %}</main><footer>Made for creators. Built for genuine discovery. <span class="footer-dot">●</span> YouGrow</footer></body></html>
