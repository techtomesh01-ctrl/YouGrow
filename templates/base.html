<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}YouGrow{% endblock %}</title>
<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#12151d;--line:#272c39;--red:#ef3340;--muted:#aab1c2;--text:#f6f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#21121a 0,transparent 48%),var(--bg);color:var(--text);font:16px/1.55 system-ui,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px max(18px,calc((100% - 1100px)/2));border-bottom:1px solid var(--line);gap:14px;flex-wrap:wrap}a{color:#ff6870}header a{text-decoration:none}.brand{font-weight:900;font-size:1.35rem;letter-spacing:.06em}.brand span{color:var(--red)}main{max-width:1100px;margin:auto;padding:26px 18px 60px}.hero,.panel,.channel{background:linear-gradient(145deg,#171b25,#0f1117);border:1px solid var(--line);border-radius:18px;padding:22px;margin:12px 0}.hero h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.05;margin:.3em 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 15px;background:var(--red);color:white;font-weight:700;text-decoration:none;cursor:pointer}.btn.secondary{background:#242a37}.field{display:block;width:100%;padding:12px;margin:5px 0 14px;border:1px solid #3b4353;border-radius:9px;background:#0b0d12;color:white}.flash{padding:12px;background:#33212a;border-radius:10px;margin:10px 0}.tag{font-size:.8rem;color:#ff9ba0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}form.inline{display:inline}small{color:var(--muted)}
</style></head><body><header><a class="brand" href="/">You<span>Grow</span></a><nav>
<a href="/">Discover</a> &nbsp; <a href="/dashboard">Dashboard</a> &nbsp;
{% if user %}<form class="inline" method="post" action="/logout"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn secondary">Logout</button></form>{% else %}<a href="/login">Login</a> &nbsp; <a href="/register">Join</a>{% endif %}
</nav></header><main>{% for message in get_flashed_messages() %}<div class="flash">{{message}}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
