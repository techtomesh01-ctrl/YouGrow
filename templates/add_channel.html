{% extends "base.html" %}{% block body %}<section class="panel"><h1>Submit a channel / चैनल जोड़ें</h1><p class="muted">Your submission is reviewed before appearing publicly.</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><label>Channel title</label><input class="field" name="title" maxlength="120" required><label>HTTPS YouTube channel URL</label><input class="field" type="url" name="youtube_url" placeholder="https://www.youtube.com/@yourchannel" required><label>Category</label><select class="field" name="category" required><option value="">Choose</option><option>Education</option><option>Gaming</option><option>Technology</option><option>Entertainment</option><option>Music</option><option>Other</option></select><label>Description</label><textarea class="field" name="description" maxlength="1000" rows="4"></textarea><button>Submit for review</button></form></section>{% endblock %}
